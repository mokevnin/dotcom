    <script>
      // Apply saved/system color scheme before render to avoid a flash (Mantine ColorSchemeScript equivalent)
      (() => {
        try {
          const saved = localStorage.getItem("mantine-color-scheme-value");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const scheme =
            saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
        } catch {}
      })();
    </script>
